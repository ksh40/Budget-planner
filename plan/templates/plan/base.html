{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UkoNaNgapi?{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'plan/css/plan.css' %}">
</head>
<body>
    <main>
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>© 2026 UkoNaNgapi? — What You Can Get With Your Budget In Nairobi.</p>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
