<div class="bm-bar">
    <button type="button" class="bm-btn{% if saved %} is-saved{% endif %}"
            data-kind="{{ kind }}" data-pk="{{ pk }}"
            aria-pressed="{% if saved %}true{% else %}false{% endif %}">
        <span class="bm-label">{% if saved %}Nimekumark{% else %}Hmmmmmmmm🤔{% endif %}</span>
        <span class="bm-count"{% if not count %} hidden{% endif %}>{{ count }}</span>
    </button>
    
    <button type="button" class="sh-btn" aria-label="Share this post"
        data-url="{% url 'share_post' mode=share_mode post_type=share_type pk=pk %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
            <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
        </svg>
    </button>

</div>
